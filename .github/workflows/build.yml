name: Build macOS

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.region }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: cn
            artifact: CN
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - region: global
            artifact: Global
            arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - region: cn
            artifact: CN
            arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - region: global
            artifact: Global
            arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
    env:
      WUWA_REGION: ${{ matrix.region }}
      WUWA_ARCH: ${{ matrix.arch }}
      WUWA_INSTALLER_MIRROR_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/upstream-resources
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Read pinned official installer cache identity
        id: installer
        run: node scripts/installer-cache.mjs

      - name: Restore pinned official installer
        id: installer-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}-${{ matrix.arch }}

      - name: Install build tools
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          test "$(uname -m)" = "${{ matrix.arch }}"
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add "${{ matrix.rust_target }}"
          brew install sevenzip

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-${{ matrix.arch }}-${{ matrix.region }}-rust-1.97.1-${{ hashFiles('src-tauri/Cargo.lock') }}

      - run: npm ci

      - name: Prepare verified regional resources and native build inputs
        id: prepare
        run: npm run setup

      - name: Save verified official installer
        if: steps.prepare.outcome == 'success' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}-${{ matrix.arch }}

      - name: Test frontend contracts and native backend
        id: native-tests
        run: |
          npm test
          npm run test:rust

      - name: Build complete application
        run: npm run build -- -- --locked

      - name: Verify and package ZIP and DMG
        run: |
          set -o pipefail
          npm run package 2>&1 | tee ".work/package-macos-${{ matrix.arch }}-${{ matrix.region }}.log"

      - name: Keep packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-diagnostics-${{ matrix.region }}-${{ matrix.arch }}
          path: .work/package-macos-${{ matrix.arch }}-${{ matrix.region }}.log
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappo-${{ matrix.artifact }}-Mac-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
